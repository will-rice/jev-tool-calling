[project]
name = "jevtools"
version = "0.1.0"
description = "Zero-shot evaluation of TypeSafe AI's Jev on BFCL tool calling."
readme = "README.md"
authors = [{ name = "Will Rice", email = "wrice20@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
  "huggingface-hub>=2.1.1",
  "pre-commit>=4.6.2",
  "pydantic>=2.13.5",
  "pydocstyle>=6.3.0",
  "pytest>=9.1.1",
  "python-dotenv>=1.2.3",
  "ruff>=0.16.8",
  "tqdm>=4.70.1",
  "ty>=0.0.83",
  "typesafe-sdk>=0.7.2",
]

[build-system]
requires = ["uv_build>=0.12.18"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["jevtools"]

[tool.ruff.lint.isort]
known-first-party = ["jevtools"]

[tool.ruff.lint]
select = ["C", "E", "F", "I", "W", "D", "N", "B", "PTH", "ANN"]
ignore = ["D107"]
exclude = [".venv"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[project.scripts]
run = "jevtools.scripts.run:main"
report = "jevtools.scripts.report:main"

# bfcl/ runs inside BFCL's own environment, where bfcl-eval is installed.
[tool.ty.src]
exclude = ["bfcl"]
